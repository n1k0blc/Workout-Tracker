packages:
  - 'apps/*'

overrides:
  multer: 2.3.0
  qs: ^6.16.0
  fast-uri: ^3.1.6
  # Transitive via jest>...>@istanbuljs/load-nyc-config (dev-only), which pins
  # ^3.13.1 - 3.15.2 is the patched version for GHSA-2883-xcg3-v3hh (issue #170).
  js-yaml: ^3.15.2
  # Transitive via prisma's bundled MySQL driver (we are Postgres-only, never
  # exercised at runtime) - 3.22.0 is the patched version for
  # GHSA-3f6p-5ww8-9rcr / GHSA-rgwj-5xj2-c3m3 (issue #170).
  mysql2: ^3.22.0

onlyBuiltDependencies:
  - '@parcel/watcher'
  - '@prisma/client'
  - '@prisma/engines'
  - argon2
  - bcrypt
  - prisma
  - sharp
  - unrs-resolver

allowBuilds:
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  argon2: true
  bcrypt: true
  prisma: true
  sharp: true
  unrs-resolver: true

auditConfig:
  ignoreGhsas:
    - GHSA-qfvm-cv95-jqjf
    # deepmerge-ts, pulled in by @prisma/config with an exact 7.1.5 pin - no
    # override is possible without breaking prisma's own resolution. Patched
    # upstream at deepmerge-ts >=8.0.0, which @prisma/config only picks up
    # once we're on Prisma 8 (tracked separately in #174, not this issue).
    - GHSA-ggr8-5vv4-36mx
