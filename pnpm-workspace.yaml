packages:
  - 'apps/*'

overrides:
  multer: 2.2.0

onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - argon2
  - bcrypt
  - prisma
  - sharp
  - unrs-resolver

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  argon2: true
  bcrypt: true
  prisma: true
  sharp: true
  unrs-resolver: true
